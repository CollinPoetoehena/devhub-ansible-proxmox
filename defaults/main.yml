---
# defaults file for devhub-ansible-proxmox
#
# Generic defaults that work for any deployment. Site-specific values
# MUST be set in group_vars/proxmox/ or host_vars/.

# Cluster management is opt-in. A two-node cluster without a QDevice loses
# quorum when either node is offline.
proxmox_cluster_enabled: false
proxmox_cluster_name: homelab
proxmox_cluster_primary: "{{ groups['proxmox'] | first }}"
proxmox_cluster_link_address: "{{ proxmox_mgmt_ipv4 | default(omit) }}"

# Least-privilege account and API token for infrastructure automation clients.
proxmox_automation_user: automation@pve
proxmox_automation_token_id: automation
proxmox_automation_role: InfrastructureProvisioner
proxmox_automation_group: automation
proxmox_automation_privileges:
  - VM.Allocate
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.CPU
  - VM.Config.Cloudinit
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.Console
  - VM.Migrate
  - VM.Monitor
  - VM.PowerMgmt
  - VM.Audit
  - Datastore.Allocate
  - Datastore.AllocateSpace
  - Datastore.AllocateTemplate
  - Datastore.Audit
  - Sys.Audit
  - Sys.Console
  - Pool.Allocate
  - Pool.Audit
  - SDN.Use
proxmox_automation_acl_path: /
proxmox_automation_acl_propagate: true
proxmox_automation_token_privsep: true
proxmox_automation_token_output: "{{ playbook_dir }}/.secrets/{{ inventory_hostname }}-proxmox-api-token.env"
proxmox_write_automation_token_file: true
proxmox_rotate_automation_token: false
proxmox_api_endpoint: "https://{{ proxmox_mgmt_ipv4 }}:8006/"
